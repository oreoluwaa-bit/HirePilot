name = "hirepilot"
main = "src/worker/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "hirepilot-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

[vars]
APP_ENV = "development"

[triggers]
crons = ["0 */6 * * *"]
