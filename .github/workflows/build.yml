name: Build HirePilot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: hirepilot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
